
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J.A.R.V.I.S</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #020b14;
    color: #00d9ff;
    font-family: Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 15px;
}

.container {
    width: 100%;
    max-width: 700px;
    border: 1px solid #00bfff;
    border-radius: 15px;
    padding: 20px;
    box-shadow: 0 0 25px #0077ff55;
}

h1 {
    text-align: center;
    letter-spacing: 5px;
    margin-bottom: 20px;
    text-shadow: 0 0 15px #00d9ff;
}

.reactor {
    width: 110px;
    height: 110px;
    border: 4px solid #00d9ff;
    border-radius: 50%;
    margin: 10px auto 25px;
    box-shadow: 0 0 25px #00d9ff, inset 0 0 20px #00d9ff;
    animation: pulse 2s infinite;
}

@keyframes pulse {
    0%, 100% {
        box-shadow: 0 0 15px #00d9ff, inset 0 0 15px #00d9ff;
    }
    50% {
        box-shadow: 0 0 35px #00d9ff, inset 0 0 30px #00d9ff;
    }
}

#messages {
    height: 300px;
    overflow-y: auto;
    border: 1px solid #0077aa;
    border-radius: 10px;
    padding: 12px;
    margin-bottom: 15px;
    background: #031522;
}

.message {
    margin: 10px 0;
    line-height: 1.5;
    overflow-wrap: anywhere;
}

.user {
    color: #ffffff;
}

.jarvis {
    color: #00d9ff;
}

.controls {
    display: flex;
    gap: 8px;
}

input {
    flex: 1;
    min-width: 0;
    padding: 12px;
    background: #061b2a;
    border: 1px solid #00bfff;
    border-radius: 8px;
    color: white;
    outline: none;
}

button {
    padding: 12px 15px;
    background: #0077aa;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
}

button:hover {
    background: #00aadd;
}

#status {
    text-align: center;
    margin: 12px 0;
    font-size: 12px;
    color: #7deaff;
}

@media (max-width: 480px) {
    .container {
        padding: 12px;
    }

    .controls {
        flex-wrap: wrap;
    }

    input {
        flex-basis: 100%;
    }
}
</style>
</head>

<body>

<div class="container">
    <h1>J.A.R.V.I.S</h1>

    <div class="reactor"></div>

    <div id="messages">
        <div class="message jarvis">
            <strong>JARVIS:</strong> Good day. JARVIS systems are online. How may I assist you?
        </div>
    </div>

    <div id="status">SYSTEM ONLINE</div>

    <div class="controls">
        <input
            type="text"
            id="input"
            placeholder="Ask JARVIS something..."
            autocomplete="off"
        >
        <button onclick="sendMessage()">SEND</button>
        <button id="mic" onclick="startListening()">🎤</button>
        <button onclick="clearChat()">CLEAR</button>
    </div>
</div>

<script>
const input = document.getElementById("input");
const messages = document.getElementById("messages");
const mic = document.getElementById("mic");
const statusText = document.getElementById("status");

const JARVIS_API =
"https://jarvis-brain.g2b65wnktk.workers.dev/";

let conversation = [];

// Add messages to the chat
function addMessage(sender, text) {
    const div = document.createElement("div");

    div.className = sender === "You" ? "message user" : "message jarvis";

    const label = document.createElement("strong");
    label.textContent = sender + ": ";

    const content = document.createTextNode(text);

    div.appendChild(label);
    div.appendChild(content);

    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
}

// BRITISH JARVIS VOICE
function speak(text) {
    if (!("speechSynthesis" in window)) {
        statusText.textContent = "VOICE NOT SUPPORTED";
        return;
    }

    speechSynthesis.cancel();

    const utterance = new SpeechSynthesisUtterance(text);
    const voices = speechSynthesis.getVoices();

    // Prefer specific British English voices
    const preferredNames = [
        "Daniel",
        "Oliver",
        "Google UK English Male",
        "Microsoft Ryan",
        "Arthur"
    ];

    let britishVoice = null;

    // First, try preferred British-sounding voice names
    for (const name of preferredNames) {
        britishVoice = voices.find(voice =>
            voice.name.toLowerCase().includes(name.toLowerCase()) &&
            voice.lang.toLowerCase().startsWith("en-gb")
        );

        if (britishVoice) break;
    }

    // Otherwise, select any available British English voice
    if (!britishVoice) {
        britishVoice = voices.find(voice =>
            voice.lang.toLowerCase().startsWith("en-gb")
        );
    }

    utterance.voice = britishVoice || null;
    utterance.lang = britishVoice ? britishVoice.lang : "en-GB";

    // Speaking settings
    utterance.rate = 0.92;
    utterance.pitch = 0.85;
    utterance.volume = 1;

    speechSynthesis.speak(utterance);
}

// Ask JARVIS
async function sendMessage() {
    const text = input.value.trim();

    if (!text) return;

    addMessage("You", text);
    input.value = "";

    conversation.push({
        role: "user",
        content: text
    });

    statusText.textContent = "JARVIS IS THINKING...";

    try {
        const response = await fetch(JARVIS_API, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                messages: conversation
            })
        });

        if (!response.ok) {
            throw new Error("Server error: " + response.status);
        }

        const data = await response.json();

        const reply =
            data.reply ||
            data.response ||
            data.result?.response ||
            data.choices?.[0]?.message?.content;

        if (!reply) {
            throw new Error("JARVIS returned an empty response.");
        }

        conversation.push({
            role: "assistant",
            content: reply
        });

        addMessage("JARVIS", reply);
        speak(reply);

        statusText.textContent = "SYSTEM ONLINE";

    } catch (error) {
        console.error(error);

        const errorMessage =
            "I apologise, but I am having trouble connecting to my AI system.";

        addMessage("JARVIS", errorMessage);
        statusText.textContent = "CONNECTION ERROR";
    }
}

// Microphone input
function startListening() {
    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    if (!SpeechRecognition) {
        statusText.textContent =
            "VOICE INPUT NOT SUPPORTED IN THIS BROWSER";
        return;
    }

    const recognition = new SpeechRecognition();

    recognition.lang = "en-GB";
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;

    recognition.onstart = () => {
        statusText.textContent = "LISTENING...";
        mic.textContent = "🔴";
    };

    recognition.onresult = (event) => {
        input.value = event.results[0][0].transcript;
        sendMessage();
    };

    recognition.onerror = () => {
        statusText.textContent = "MICROPHONE ERROR";
    };

    recognition.onend = () => {
        mic.textContent = "🎤";

        if (statusText.textContent === "LISTENING...") {
            statusText.textContent = "SYSTEM ONLINE";
        }
    };

    recognition.start();
}

// Clear conversation
function clearChat() {
    messages.innerHTML = "";
    conversation = [];
    speechSynthesis.cancel();

    addMessage(
        "JARVIS",
        "Conversation cleared. At your service."
    );

    statusText.textContent = "SYSTEM ONLINE";
}

// Send message with Enter
input.addEventListener("keydown", function(event) {
    if (event.key === "Enter") {
        sendMessage();
    }
});

// Load available voices
if ("speechSynthesis" in window) {
    speechSynthesis.getVoices();

    speechSynthesis.onvoiceschanged = () => {
        speechSynthesis.getVoices();
    };
}
</script>

</body>
</html>
